<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>밸류체인 맵 — Value Chain Explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg:        #0d0f14;
  --bg2:       #13161e;
  --bg3:       #1a1d27;
  --bg4:       #20232f;
  --border:    rgba(255,255,255,0.07);
  --border2:   rgba(255,255,255,0.13);
  --text:      #e8eaf0;
  --text2:     #8b8fa8;
  --text3:     #555870;
  --accent:    #4f7fff;
  --good:      #3ecf8e;
  --good-bg:   rgba(62,207,142,0.1);
  --warn:      #f5a623;
  --warn-bg:   rgba(245,166,35,0.1);
  --bad:       #f04e4e;
  --bad-bg:    rgba(240,78,78,0.1);
  --supplier:  #3ecf8e;
  --customer:  #4f7fff;
  --competitor:#f5a623;
  --radius:    10px;
  --radius-lg: 14px;
  --header-h:  52px;
  --tab-h:     48px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-tap-highlight-color: transparent; }

body {
  font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  font-size: 14px;
  line-height: 1.6;
  overscroll-behavior: none;
}

/* ─── HEADER ─── */
header {
  height: var(--header-h);
  padding: 0 20px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  position: sticky;
  top: 0;
  z-index: 200;
  background: rgba(13,15,20,0.95);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
.logo {
  display: flex;
  align-items: center;
  gap: 9px;
  font-size: 15px;
  font-weight: 600;
  letter-spacing: -0.02em;
}
.logo-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 7px var(--accent);
  animation: pulse 2.4s ease-in-out infinite;
  flex-shrink: 0;
}
@keyframes pulse {
  0%,100% { opacity:1; transform:scale(1); }
  50%      { opacity:.55; transform:scale(.82); }
}
.header-date {
  font-size: 11px;
  color: var(--text3);
  font-family: 'DM Mono', monospace;
}

/* ─── DESKTOP LAYOUT ─── */
.desktop-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  grid-template-rows: auto 1fr;
  height: calc(100vh - var(--header-h));
}
.corp-section {
  grid-column: 1/2;
  padding: 18px 24px 0;
  border-bottom: 1px solid var(--border);
}
.chain-panel {
  grid-column: 1/2;
  overflow-y: auto;
  padding: 22px 24px;
  scrollbar-width: thin;
  scrollbar-color: var(--bg4) transparent;
}
.log-panel {
  grid-column: 2/3;
  grid-row: 1/3;
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* ─── MOBILE LAYOUT ─── */
.mobile-layout { display: none; flex-direction: column; height: calc(100vh - var(--header-h)); }

/* ─── SECTION LABEL ─── */
.section-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text3);
  margin-bottom: 11px;
}

/* ─── CORP GRID ─── */
.corp-grid {
  display: flex;
  gap: 9px;
  padding-bottom: 18px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}
.corp-grid::-webkit-scrollbar { display: none; }

.corp-card {
  flex-shrink: 0;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 13px 16px;
  cursor: pointer;
  transition: all 0.16s ease;
  min-width: 120px;
  position: relative;
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
}
.corp-card::before {
  content:'';
  position:absolute; inset:0;
  background: linear-gradient(135deg, var(--accent) 0%, transparent 60%);
  opacity:0; transition:opacity .16s;
}
.corp-card:active { transform: scale(0.97); }
.corp-card.active { border-color: var(--accent); background: rgba(79,127,255,0.08); }
.corp-card.active::before { opacity: 0.06; }
.corp-icon { font-size: 18px; margin-bottom: 7px; display: block; }
.corp-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; }
.corp-sector { font-size: 11px; color: var(--text3); margin-top: 1px; white-space: nowrap; }

/* ─── CHAIN CONTENT ─── */
.chain-empty {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  height: 240px;
  color: var(--text3);
  gap: 11px;
}
.chain-empty p { font-size: 13px; }
.chain-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.chain-corp-name { font-size: 19px; font-weight: 600; letter-spacing: -0.02em; }
.chain-corp-sector {
  font-size: 11px; color: var(--text3);
  border: 1px solid var(--border2);
  padding: 3px 9px; border-radius: 20px;
}

.tier-block { margin-bottom: 22px; }
.tier-block + .tier-block { padding-top: 3px; border-top: 1px solid var(--border); }
.tier-label {
  display: flex; align-items: center;
  gap: 7px; margin-bottom: 10px;
}
.tier-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.tier-dot.supplier   { background: var(--supplier); }
.tier-dot.customer   { background: var(--customer); }
.tier-dot.competitor { background: var(--competitor); }
.tier-name { font-size:10px; font-weight:500; letter-spacing:.1em; text-transform:uppercase; color:var(--text3); }
.tier-count { font-size:10px; font-family:'DM Mono',monospace; color:var(--text3); margin-left:auto; }

.chips-wrap { display:flex; flex-wrap:wrap; gap:7px; }
.chip {
  display:inline-flex; align-items:center; gap:6px;
  padding: 7px 13px;
  border-radius:20px;
  background:var(--bg3);
  border:1px solid var(--border);
  font-size:12px;
  color:var(--text2);
  cursor:pointer;
  transition:all .14s ease;
  -webkit-user-select:none; user-select:none;
  touch-action: manipulation;
}
.chip:active { transform: scale(0.95); }
.chip.active-supplier   { border-color:var(--supplier);   color:var(--supplier);   background:rgba(62,207,142,.09); }
.chip.active-customer   { border-color:var(--customer);   color:var(--customer);   background:rgba(79,127,255,.09); }
.chip.active-competitor { border-color:var(--competitor); color:var(--competitor); background:rgba(245,166,35,.09); }
.chip-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }

/* ─── LOG PANEL ─── */
.log-panel-header {
  padding: 18px 18px 13px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.log-panel-title {
  font-size: 13px; font-weight: 600;
  margin-bottom: 11px;
  display: flex; align-items: center; gap: 8px;
  flex-wrap: wrap;
}
.log-target-badge {
  font-size:11px; font-weight:400;
  color:var(--accent);
  background:rgba(79,127,255,.12);
  border:1px solid rgba(79,127,255,.25);
  padding:2px 9px; border-radius:12px;
}
.filter-row { display:flex; gap:6px; }
.filter-btn {
  flex:1;
  display:flex; align-items:center; justify-content:center; gap:5px;
  padding:6px 0;
  border-radius:8px;
  border:1px solid var(--border);
  background:transparent;
  color:var(--text3);
  font-size:12px;
  font-family:inherit;
  cursor:pointer;
  transition:all .14s;
  touch-action: manipulation;
  -webkit-user-select:none; user-select:none;
}
.filter-btn:active { transform: scale(0.96); }
.filter-dot { width:5px; height:5px; border-radius:50%; flex-shrink:0; }
.f-good .filter-dot { background:var(--good); }
.f-warn .filter-dot { background:var(--warn); }
.f-bad  .filter-dot { background:var(--bad); }
.f-all.on  { border-color:var(--border2); color:var(--text); background:var(--bg4); }
.f-good.on { border-color:rgba(62,207,142,.4); color:var(--good); background:var(--good-bg); }
.f-warn.on { border-color:rgba(245,166,35,.4); color:var(--warn); background:var(--warn-bg); }
.f-bad.on  { border-color:rgba(240,78,78,.4);  color:var(--bad);  background:var(--bad-bg); }

.log-scroll {
  flex:1; overflow-y:auto; padding:10px;
  scrollbar-width:thin; scrollbar-color:var(--bg4) transparent;
  -webkit-overflow-scrolling: touch;
}
.log-empty-state {
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  height:180px; color:var(--text3); font-size:12px; gap:8px; text-align:center; line-height:1.7;
}
.log-item {
  display:flex; gap:10px; align-items:flex-start;
  padding:11px 12px;
  border-radius:var(--radius);
  border:1px solid var(--border);
  background:var(--bg3);
  margin-bottom:6px;
  cursor:pointer;
  transition:all .14s;
  animation:slideIn .2s ease both;
}
@keyframes slideIn { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:none} }
.log-item:active { background:var(--bg4); }
.log-signal {
  flex-shrink:0; width:18px; height:18px;
  border-radius:50%; display:flex; align-items:center; justify-content:center;
  margin-top:1px; font-size:10px; font-weight:600;
}
.sig-good { background:var(--good-bg); color:var(--good); border:1px solid rgba(62,207,142,.3); }
.sig-warn { background:var(--warn-bg); color:var(--warn); border:1px solid rgba(245,166,35,.3); }
.sig-bad  { background:var(--bad-bg);  color:var(--bad);  border:1px solid rgba(240,78,78,.3); }
.log-body { flex:1; min-width:0; }
.log-text { font-size:12px; color:var(--text); line-height:1.5; margin-bottom:5px; }
.log-meta { display:flex; align-items:center; gap:7px; flex-wrap:wrap; }
.log-date { font-size:10px; font-family:'DM Mono',monospace; color:var(--text3); }
.log-tag { font-size:10px; padding:1px 7px; border-radius:6px; font-weight:500; }
.tag-disclosure { background:rgba(79,127,255,.12); color:#7fa4ff; border:1px solid rgba(79,127,255,.2); }
.tag-news       { background:var(--bg4); color:var(--text3); border:1px solid var(--border); }

.stats-bar {
  padding:9px 12px;
  border-top:1px solid var(--border);
  display:flex; gap:12px; flex-shrink:0;
}
.stat-item { display:flex; align-items:center; gap:5px; font-size:11px; }
.stat-dot  { width:6px; height:6px; border-radius:50%; }
.stat-label { color:var(--text3); }
.stat-val   { font-family:'DM Mono',monospace; font-size:11px; }
.stat-val.good { color:var(--good); }
.stat-val.warn { color:var(--warn); }
.stat-val.bad  { color:var(--bad); }

/* ─── MOBILE TAB BAR ─── */
.mob-tabs {
  display:flex;
  border-bottom:1px solid var(--border);
  flex-shrink:0;
  background:var(--bg2);
}
.mob-tab {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:3px; padding:10px 4px;
  font-size:11px; color:var(--text3);
  cursor:pointer; border:none; background:transparent;
  font-family:inherit;
  transition:color .14s;
  position:relative;
  -webkit-user-select:none; user-select:none;
  touch-action:manipulation;
}
.mob-tab.active { color:var(--accent); }
.mob-tab.active::after {
  content:'';
  position:absolute; bottom:0; left:20%; right:20%;
  height:2px; background:var(--accent); border-radius:2px 2px 0 0;
}
.mob-tab svg { width:18px; height:18px; }

/* 탭 콘텐츠 */
.mob-page { display:none; flex:1; overflow:hidden; flex-direction:column; }
.mob-page.active { display:flex; }

/* 모바일 corp section */
.mob-corp-section { padding:16px 16px 0; border-bottom:1px solid var(--border); flex-shrink:0; }
.mob-chain-panel  { flex:1; overflow-y:auto; padding:18px 16px; -webkit-overflow-scrolling:touch; }

/* 모바일 로그 패널 */
.mob-log-panel { display:flex; flex-direction:column; flex:1; overflow:hidden; }

/* ─── RESPONSIVE ─── */
@media (max-width: 680px) {
  .desktop-layout { display:none; }
  .mobile-layout  { display:flex; }
}

::-webkit-scrollbar { width:3px; height:3px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:var(--bg4); border-radius:3px; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <span class="logo-dot"></span>
    밸류체인 맵
  </div>
  <span class="header-date" id="headerDate"></span>
</header>

<!-- ══════════ DESKTOP ══════════ -->
<div class="desktop-layout">
  <div class="corp-section">
    <div class="section-label">대기업 선택</div>
    <div class="corp-grid" id="d-corpGrid"></div>
  </div>
  <div class="chain-panel" id="d-chainPanel">

      <p>대기업을 선택하면 밸류체인이 표시됩니다</p>

      <div class="log-panel-title">

      </div>
      <div class="filter-row">
        <button class="filter-btn f-all on" data-f="all"  onclick="setFilter('d','all',this)">전체</button>
        <button class="filter-btn f-good"   data-f="good" onclick="setFilter('d','good',this)"><span class="filter-dot"></span>호재</button>
        <button class="filter-btn f-warn"   data-f="warn" onclick="setFilter('d','warn',this)"><span class="filter-dot"></span>주의</button>
        <button class="filter-btn f-bad"    data-f="bad"  onclick="setFilter('d','bad',this)"><span class="filter-dot"></span>악재</button>
      </div>
    </div>
    <div class="log-scroll" id="d-logScroll">
      <div class="log-empty-state">
        <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
        <span>기업을 선택하면<br>공시·뉴스가 표시됩니다</span>
      </div>
    </div>
    <div class="stats-bar" id="d-statsBar" style="display:none">

      <div class="stat-item"><span class="stat-dot" style="background:var(--warn)"></span><span class="stat-label">주의</span><span class="stat-val warn" id="d-cntWarn">0</span></div>

    </div>
  </div>
</div>

<!-- ══════════ MOBILE ══════════ -->
<div class="mobile-layout">

  <!-- 탭 바 -->
  <div class="mob-tabs">
    <button class="mob-tab active" id="m-tab-corp" onclick="mobTab('corp')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v2"/></svg>

    </button>
    <button class="mob-tab" id="m-tab-chain" onclick="mobTab('chain')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
      밸류체인
    </button>
    <button class="mob-tab" id="m-tab-log" onclick="mobTab('log')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
      공시·뉴스
      <span id="m-logDot" style="display:none;position:absolute;top:8px;right:calc(50% - 18px);width:6px;height:6px;border-radius:50%;background:var(--accent);"></span>
    </button>
  </div>

  <!-- 기업 선택 탭 -->
  <div class="mob-page active" id="m-page-corp">
    <div class="mob-corp-section">
      <div class="section-label">대기업 선택</div>
      <div class="corp-grid" id="m-corpGrid"></div>
    </div>
    <div style="padding:20px 16px; color:var(--text3); font-size:12px; text-align:center; line-height:1.8;">
      기업을 선택한 뒤<br>아래 탭에서 밸류체인과 공시·뉴스를 확인하세요
    </div>
  </div>

  <!-- 밸류체인 탭 -->
  <div class="mob-page" id="m-page-chain">
    <div class="mob-chain-panel" id="m-chainPanel">
      <div class="chain-empty" id="m-chainEmpty">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        <p>기업 선택 탭에서 대기업을 먼저 선택하세요</p>
      </div>
      <div id="m-chainContent" style="display:none"></div>
    </div>
  </div>

  <!-- 공시·뉴스 탭 -->
  <div class="mob-page" id="m-page-log">
    <div class="mob-log-panel">
      <div class="log-panel-header">
        <div class="log-panel-title">
          공시 · 뉴스 로그
          <span class="log-target-badge" id="m-logBadge" style="display:none"></span>
        </div>
        <div class="filter-row">
          <button class="filter-btn f-all on" data-f="all"  onclick="setFilter('m','all',this)">전체</button>

      </div>
      <div class="log-scroll" id="m-logScroll">
        <div class="log-empty-state">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span>기업을 선택하면<br>공시·뉴스가 표시됩니다</span>
        </div>
      </div>
      <div class="stats-bar" id="m-statsBar" style="display:none">
        <div class="stat-item"><span class="stat-dot" style="background:var(--good)"></span><span class="stat-label">호재</span><span class="stat-val good" id="m-cntGood">0</span></div>
        <div class="stat-item"><span class="stat-dot" style="background:var(--warn)"></span><span class="stat-label">주의</span><span class="stat-val warn" id="m-cntWarn">0</span></div>
        <div class="stat-item"><span class="stat-dot" style="background:var(--bad)"></span><span class="stat-label">악재</span><span class="stat-val bad"  id="m-cntBad">0</span></div>
      </div>
    </div>
  </div>

</div><!-- /.mobile-layout -->

<script>
/* ── DATA ── */

/* ── STATE ── */
let activeCorpId = null;
let state = {
  d: { filter:'all', logs:[] },
  m: { filter:'all', logs:[] },
};

/* ── INIT ── */
document.getElementById('headerDate').textContent =
  new Date().toLocaleDateString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit'});
renderCorps('d');
renderCorps('m');

/* ── MOBILE TAB ── */
function mobTab(tab) {
  ['corp','chain','log'].forEach(t => {
    document.getElementById(`m-tab-${t}`).classList.toggle('active', t===tab);
    document.getElementById(`m-page-${t}`).classList.toggle('active', t===tab);
  });
  if (tab==='log') document.getElementById('m-logDot').style.display='none';
}

/* ── RENDER CORPS ── */
function renderCorps(ns) {
  document.getElementById(`${ns}-corpGrid`).innerHTML = corps.map(c=>`
    <div class="corp-card${activeCorpId===c.id?' active':''}" onclick="selectCorp('${c.id}')">
      <span class="corp-icon">${c.icon}</span>
      <div class="corp-name">${c.name}</div>
      <div class="corp-sector">${c.sector}</div>
    </div>
  `).join('');
}

/* ── SELECT CORP ── */
function selectCorp(id) {
  activeCorpId = id;
  renderCorps('d');
  renderCorps('m');
  renderChain('d', id);
  renderChain('m', id);
  loadLogs('d', id, corps.find(c=>c.id===id).name);
  loadLogs('m', id, corps.find(c=>c.id===id).name);
  // 모바일: 밸류체인 탭으로 자동 이동
  if (window.innerWidth <= 680) {
    mobTab('chain');
  }
  // 공시탭 알림 점
  document.getElementById('m-logDot').style.display = 'block';
}

/* ── RENDER CHAIN ── */
function renderChain(ns, id) {
  const corp = corps.find(c=>c.id===id);
  const data = chains[id];
  document.getElementById(`${ns}-chainEmpty`).style.display = 'none';
  const ct = document.getElementById(`${ns}-chainContent`);
  ct.style.display = 'block';
  ct.innerHTML = `
    <div class="chain-header">
      <span class="chain-corp-name">${corp.name}</span>
      <span class="chain-corp-sector">${corp.sector}</span>
    </div>
    ${renderTier(ns, 'supplier',   '공급사 · Supplier',   data.supplier)}
    ${renderTier(ns, 'customer',   '고객사 · Customer',   data.customer)}
    ${renderTier(ns, 'competitor', '경쟁사 · Competitor', data.competitor)}
  `;
}

function renderTier(ns, type, label, companies) {
  return `
    <div class="tier-block">
      <div class="tier-label">
        <span class="tier-dot ${type}"></span>
        <span class="tier-name">${label}</span>
        <span class="tier-count">${companies.length}</span>
      </div>
      <div class="chips-wrap">
        ${companies.map(n=>`
          <div class="chip" data-type="${type}" data-ns="${ns}" onclick="selectChip(this,'${n.replace(/'/g,"\\'")}')">
            <span class="chip-dot" style="background:var(--${type})"></span>
            ${n}
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

/* ── SELECT CHIP ── */
function selectChip(el, name) {
  const ns = el.dataset.ns;
  // 같은 ns의 chip만 리셋
  document.querySelectorAll(`[data-ns="${ns}"].chip`).forEach(c=>c.className=`chip`);
  el.dataset.ns = ns; // 유지
  const type = el.dataset.type;
  el.classList.add(`active-${type}`);
  loadLogs(ns, activeCorpId, name);
  // 모바일: 칩 클릭하면 로그 탭으로
  if (ns==='m') {
    setTimeout(()=>mobTab('log'), 150);
  }
}

/* ── LOAD LOGS ── */
function loadLogs(ns, corpId, targetName) {
  document.getElementById(`${ns}-logBadge`).textContent = targetName;
  document.getElementById(`${ns}-logBadge`).style.display = '';
  document.getElementById(`${ns}-statsBar`).style.display = 'flex';
  state[ns].filter = 'all';
  state[ns].logs = logs[corpId] || [];
  // 필터 버튼 초기화
  const panel = ns==='d'
    ? document.querySelector('.desktop-layout .log-panel')
    : document.getElementById('m-page-log');
  panel.querySelectorAll('.filter-btn').forEach(b=>b.classList.toggle('on', b.dataset.f==='all'));
  updateStats(ns);
  renderLogs(ns);
}

function updateStats(ns) {
  const l = state[ns].logs;
  document.getElementById(`${ns}-cntGood`).textContent = l.filter(x=>x.signal==='good').length;
  document.getElementById(`${ns}-cntWarn`).textContent = l.filter(x=>x.signal==='warn').length;
  document.getElementById(`${ns}-cntBad`).textContent  = l.filter(x=>x.signal==='bad').length;
}

const sigMap = {
  good:{cls:'sig-good',sym:'✓'},
  warn:{cls:'sig-warn',sym:'!'},
  bad: {cls:'sig-bad', sym:'✕'},
};

function renderLogs(ns) {
  const f = state[ns].filter;
  const list = f==='all' ? state[ns].logs : state[ns].logs.filter(l=>l.signal===f);
  const scroll = document.getElementById(`${ns}-logScroll`);
  if (!list.length) {
    scroll.innerHTML = `<div class="log-empty-state">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.3"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span>해당 조건의 로그가 없습니다</span>
    </div>`; return;
  }
  scroll.innerHTML = list.map((l,i)=>`
    <div class="log-item" style="animation-delay:${i*.04}s">
      <div class="log-signal ${sigMap[l.signal].cls}">${sigMap[l.signal].sym}</div>
      <div class="log-body">
        <div class="log-text">${l.text}</div>
        <div class="log-meta">
          <span class="log-date">${l.date}</span>
          <span class="log-tag ${l.type==='공시'?'tag-disclosure':'tag-news'}">${l.type}</span>
        </div>
      </div>
    </div>
  `).join('');
}

function setFilter(ns, f, btn) {
  state[ns].filter = f;
  const panel = ns==='d'
    ? document.querySelector('.desktop-layout .log-panel')
    : document.getElementById('m-page-log');
  panel.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderLogs(ns);
}
</script>
